name: Test

# Runs the unit tests and the g1 test vectors on the Node.js versions the kit supports.
# There are no dependencies, so there is nothing to install.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Show the versions
        run: node --version

      - name: Tests, test vectors and fixtures
        run: npm test

      - name: The records of the kit itself
        run: node record-keeper.mjs validate docs/decisions

  # One check with a fixed name that a ruleset can require, whatever the matrix is.
  gate:
    name: Test gate
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Node.js version must have passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::The test jobs finished with: $RESULT"
            exit 1
          fi
