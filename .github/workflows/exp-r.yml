name: exp-R
on:
  pull_request_review:
    types: [submitted]
jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "VERSION-MARKER: HEAD-R"
          echo "GITHUB_SHA=$GITHUB_SHA GITHUB_REF=$GITHUB_REF event=${{ github.event_name }} action=${{ github.event.action }}"
          echo "event review: state=${{ github.event.review.state }} commit_id=${{ github.event.review.commit_id }} user.id=${{ github.event.review.user.id }} user.login=${{ github.event.review.user.login }}"
          echo "--- reviews API with the read-only token:"
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --jq '.[] | {id, user_id: .user.id, login: .user.login, commit_id, state, submitted_at, author_association}'
