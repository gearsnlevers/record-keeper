name: exp-A
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  guard:
    name: Records integrity
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel ${{ github.run_id }} -R ${{ github.repository }}
          sleep 120
