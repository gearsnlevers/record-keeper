name: exp-A
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
jobs:
  guard:
    name: Records integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - run: |
          echo "exp-A (base branch workflow) running for PR head ${{ github.event.pull_request.head.sha }}"
          exit 1
