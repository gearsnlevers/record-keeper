name: exp-A
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  poster:
    name: poster
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CONCLUSION: ${{ contains(github.event.pull_request.title, 'NEUTRAL') && 'neutral' || 'success' }}
        run: |
          gh api repos/${{ github.repository }}/check-runs -X POST \
            -f name='Records integrity' -f head_sha="$SHA" -f status=completed \
            -f conclusion="$CONCLUSION" -f 'output[title]=posted by the poster job' -f 'output[summary]=posted by API'
